<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheetah Agent Cloud v3.0</title>
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #ffffff; 
            --bg-deep: #f4f4f0; 
            --card-dark: #ffffff;
            --primary-orange: #000000; 
            --accent-orange: #333333; 
            --text-main: #000000; 
            --text-muted: #555555; 
            --glass-border: #000000; 
            --green-installed: #000000; 
            --red-alert: #000000; 
            --blue-biz: #000000;
        }

        * { font-family: 'Poppins', sans-serif; box-sizing: border-box; transition: all 0.2s ease-in-out; }
        
        body {
            background-color: var(--bg-deep);
            background-image: radial-gradient(#cccccc 1px, transparent 1px);
            background-size: 20px 20px; 
            color: var(--text-main); margin: 0; padding: 20px; min-height: 100vh;
        }

        /* Scrollbar Theme */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: black; border-radius: 4px; }

        .auth-container { max-width: 400px; margin: 100px auto; text-align: center; }
        .main-app { display: none; max-width: 800px; margin: 0 auto; }
        
        /* Panels - Solid Borders and Shadows */
        .glass-panel { 
            background: var(--card-dark);
            border-radius: 8px; 
            border: 2px solid var(--glass-border); 
            padding: 20px; margin-bottom: 20px;
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 1); 
        }

        .dashboard { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 20px; }
        
        .stat-card { 
            background: var(--card-dark); padding: 20px; border-radius: 8px; 
            border: 2px solid var(--glass-border); 
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .type-toggle { display: flex; border: 2px solid black; border-radius: 6px; padding: 4px; margin-bottom: 15px; background: white; }
        .type-btn { flex: 1; padding: 10px; border: none; background: transparent; color: var(--text-muted); cursor: pointer; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .type-btn.active { background: black; color: white; }

        .filter-row { display: flex; gap: 8px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
        .filter-pill { background: white; border: 2px solid black; padding: 6px 15px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; cursor: pointer; color: black; white-space: nowrap; box-shadow: 2px 2px 0px black; }
        .filter-pill.active { background: black; color: white; box-shadow: none; transform: translate(2px, 2px); }

        /* Inputs */
        input, select, textarea { 
            background: transparent; 
            border: 2px solid black; 
            padding: 12px; border-radius: 4px; color: black; margin-bottom: 12px; width: 100%; 
            font-weight: 600;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; background: white;
            box-shadow: 4px 4px 0px black;
        }
        select option { background-color: white; color: black; }

        /* Buttons */
        .primary-btn { 
            background: white; 
            padding: 12px; border-radius: 4px; border: 2px solid black; font-weight: 700; color: black; 
            cursor: pointer; width: 100%; 
            box-shadow: 4px 4px 0px black;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .primary-btn:hover {
            transform: translate(2px, 2px); 
            box-shadow: 2px 2px 0px black; 
        }
        
        /* Client Cards */
        .client-card { 
            background: var(--card-dark); 
            border-radius: 8px; padding: 20px; margin-bottom: 15px; 
            border: 2px solid var(--glass-border); 
            box-shadow: 4px 4px 0px rgba(0, 0, 0, 1);
        }
        .client-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px rgba(0, 0, 0, 1);
        }
        .client-installed { border-left: 8px solid black; }
        .client-cancelled { opacity: 0.7; background: #eaeaea; border-style: dashed; }
        
        /* Tags for Res/Biz */
        .tag { font-size: 0.7rem; padding: 4px 10px; border-radius: 4px; font-weight: 700; text-transform: uppercase; border: 1px solid black; }
        .tag-res { background: white; color: black; }
        .tag-biz { background: #d4d4d4; color: black; } 
        
        /* Sketchy Progress Bar */
        .progress-bar { height: 16px; background: transparent; border: 2px solid black; border-radius: 4px; margin-top: 10px; width: 100%; overflow: hidden; }
        #progressFill { 
            height: 100%; 
            background: repeating-linear-gradient(45deg, #000, #000 2px, #fff 2px, #fff 6px); 
            width: 0%; transition: 0.5s; 
        }

        .sidebar { 
            position: fixed; right: -350px; top: 0; width: 320px; height: 100%; background: var(--bg-deep); 
            padding: 20px; z-index: 200; box-shadow: -10px 0 30px rgba(0,0,0,0.2); 
            border-left: 4px solid black;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto;
        }
        .sidebar.active { right: 0; }

        .hidden { display: none; }
        
        /* FAB Menu Sketchy Theme */
        .fab-main-btn {
            position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; 
            border-radius: 50%; background: white; border: 2px solid black;
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
            z-index: 110; box-shadow: 4px 4px 0px black; color: black; font-size: 1.5rem;
        }
        .fab-menu.active .fab-main-btn { transform: rotate(135deg); background: black; color: white; box-shadow: 2px 2px 0px black; }

        .toggle-ledger-btn, .floating-locator-btn, .floating-workspace-btn {
            position: fixed; right: 35px; width: 50px; height: 50px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
            z-index: 100; box-shadow: 3px 3px 0px black; color: black; font-size: 1.2rem;
            background: white; border: 2px solid black; text-decoration: none;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            bottom: 35px; opacity: 0; pointer-events: none; transform: scale(0.5) translateY(20px);
        }
        
        .fab-menu.active .toggle-ledger-btn { bottom: 105px; opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
        .fab-menu.active .floating-locator-btn { bottom: 170px; opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
        .fab-menu.active .floating-workspace-btn { bottom: 235px; opacity: 1; pointer-events: auto; transform: scale(1) translateY(0); }
    </style>
</head>
<body>

    <div id="authSection" class="auth-container glass-panel">
        <h1 style="font-weight: 900;">Cheetah <span style="background: black; color: white; padding: 2px 8px; border-radius: 4px;">PRO</span></h1>
        <p style="font-weight: 600;">Login to Sync Data</p>
        <input type="email" id="authEmail" placeholder="Email">
        <input type="password" id="authPass" placeholder="Password">
        <button class="primary-btn" onclick="handleAuth('login')">Login</button>
        <button class="primary-btn" style="background:transparent; margin-top:10px" onclick="handleAuth('signup')">Sign Up</button>
    </div>

    <div id="appSection" class="main-app">
        <header style="display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;">
            <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 10px;">
                <img src="icon-192.png" alt="Cheetah Logo" style="width: 50px; height: 50px; border-radius: 8px; border: 2px solid black; box-shadow: 4px 4px 0px black;">
                <h1 style="margin: 0; font-weight: 900;">Cheetah <span style="background: black; color: white; padding: 2px 8px; border-radius: 4px;">PRO</span></h1>
            </div>

            <div style="display:flex; justify-content:center; gap:15px; align-items:center">
                <select id="viewMonth" class="month-select" style="width:auto; margin:0; padding: 8px; background: white; color: black; box-shadow: 2px 2px 0px black;" onchange="render()"></select>

                <button onclick="clearCache()" style="background:transparent; border:none; color:black; cursor:pointer; font-size: 1.2rem; margin-right: 5px;" title="Clear Cache & Reload">
                    <i class="fa-solid fa-broom"></i>
                </button>

                <button onclick="logout()" style="background:transparent; border:none; color:black; cursor:pointer; font-size: 1.2rem;" title="Logout">
                    <i class="fa-solid fa-power-off"></i>
                </button>
            </div>
        </header>

        <div class="dashboard">
            <div class="stat-card">
                <div><h3 style="margin:0;">Residential</h3><p id="resCommi" style="font-weight:800; font-size:1.2rem; margin:5px 0 0 0;">₱0</p></div>
                <div style="text-align:right"><h3 style="margin:0;">Business</h3><p id="bizCommi" style="font-weight:800; font-size:1.2rem; margin:5px 0 0 0;">₱0</p></div>
            </div>
            <div class="stat-card" style="flex-direction:column; align-items: flex-start;">
                <div style="display:flex; justify-content:space-between; width:100%">
                    <h3 id="targetCount" style="margin:0;">0 / 20</h3>
                    <small id="targetBreakdown" style="font-weight: 600;">0 Res | 0 Biz</small>
                </div>
                <div class="progress-bar"><div id="progressFill"></div></div>
            </div>
        </div>

        <div id="motivationBox" class="glass-panel" style="text-align:center;">
            <h4 id="quoteText" style="margin:0; font-size: 1.1rem; font-weight: 800;">"Great things take time."</h4>
            <small id="subQuote" style="font-weight: 600;">Stay consistent, results will follow.</small>
        </div>

        <div class="glass-panel">
            <div class="type-toggle">
                <button class="type-btn active" id="resBtn" onclick="setClientType('residential')">Residential</button>
                <button class="type-btn" id="bizBtn" onclick="setClientType('business')">Business</button>
            </div>
            <div style="display:flex; gap:10px">
                <input type="text" id="fn" placeholder="First Name">
                <input type="text" id="ln" placeholder="Last Name">
            </div>
            <select id="areaSelect">
                <option value="" disabled selected>Select Area</option>
                <option value="Baras">Baras</option><option value="Tanay">Tanay</option><option value="Morong">Morong</option>
                <option value="Pililla">Pililla</option><option value="Angono">Angono</option><option value="Binangonan">Binangonan</option>
                <option value="Antipolo">Antipolo</option><option value="Taytay">Taytay</option><option value="Teresa">Teresa</option>
                <option value="Cardona">Cardona</option><option value="Jala-Jala">Jala-Jala</option>
            </select>
            <select id="resPlans">
                <option value="" disabled selected>Select Plan</option>
                <option value="80" data-commi="300">80 Mbps (₱699) - 300 Commi</option>
                <option value="150" data-commi="400">150 Mbps (₱999) - 400 Commi</option>
                <option value="300" data-commi="500">300 Mbps (₱1250) - 500 Commi</option>
                <option value="500" data-commi="600">500 Mbps (₱1500) - 600 Commi</option>
                <option value="1000" data-commi="1000">1000 Mbps (₱4000) - 1000 Commi</option>
            </select>
            <select id="bizPlans" class="hidden">
                <option value="" disabled selected>Select Biz Plan</option>
                <option value="Biz Lite" data-commi="600">Biz Lite 1.5 - 600 Commi</option>
                <option value="Biz Professional" data-commi="1200">Biz Professional 3.0 - 1200 Commi</option>
                <option value="Biz Enterprise" data-commi="2400">Biz Enterprise 6.0 - 2400 Commi</option>
            </select>
            <button class="primary-btn" onclick="addClient()"><i class="fa-solid fa-user-plus"></i> Add Client</button>
        </div>

        <input type="text" id="searchInput" placeholder="Search..." onkeyup="render()">
        <div class="filter-row">
            <div class="filter-pill active" onclick="setStatusFilter('all', this)">All</div>
            <div class="filter-pill" onclick="setStatusFilter('pending', this)">Pending</div>
            <div class="filter-pill" onclick="setStatusFilter('installed', this)">Installed</div>
            <div class="filter-pill" onclick="setStatusFilter('cancelled', this)">Cancelled</div>
        </div>

        <div id="clientList"></div>

        <div id="fabMenu" class="fab-menu">
            <a href="https://youssefnassar314-sudo.github.io/auto-fillout/" target="_blank" class="floating-workspace-btn" title="Workspace">
                <i class="fa-solid fa-briefcase"></i>
            </a>
            
            <a href="https://youssefnassar314-sudo.github.io/cheetah-locator/" target="_blank" class="floating-locator-btn" title="Locator">
                <i class="fa-solid fa-map-location-dot"></i>
            </a>
            
            <div class="toggle-ledger-btn" onclick="toggleLedger()" title="Ledger">
                <i class="fa-solid fa-wallet"></i>
            </div>
            
            <div class="fab-main-btn" onclick="document.getElementById('fabMenu').classList.toggle('active')">
                <i class="fa-solid fa-plus"></i>
            </div>
        </div>
    </div>

    <div id="ledgerSidebar" class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="margin:0; font-weight: 900;">Personal Ledger</h3>
            <i class="fa-solid fa-xmark" onclick="toggleLedger()" style="cursor:pointer; font-size:1.5rem; color:black;"></i>
        </div>
        <input type="text" id="ledgerDesc" placeholder="Description">
        <input type="number" id="ledgerAmount" placeholder="Amount">
        <input type="date" id="ledgerDate">
        <button class="primary-btn" onclick="addLedgerEntry()">Save Entry</button>
        <div id="ledgerList" style="margin-top:20px; max-height: 400px; overflow-y: auto;"></div>
        <div style="margin-top:15px; text-align:right">
            <small style="font-weight: 600;">Total Ledger:</small>
            <div id="extraTotal" style="font-weight:900; font-size:1.2rem; border-top: 2px solid black; padding-top: 5px;">₱0</div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, where, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAHZATQBgAesBsbPy5W2xoUS7GBMPkl3hk",
            authDomain: "cheetah-tracker-app.firebaseapp.com",
            projectId: "cheetah-tracker-app",
            storageBucket: "cheetah-tracker-app.firebasestorage.app",
            messagingSenderId: "981209296948",
            appId: "1:981209296948:web:5bc5db3ad94d11f5d2da61",
            measurementId: "G-KGTBSKD57D"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null, clients = [], ledger = [], currentType = 'residential', currentStatusFilter = 'all';
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        window.handleAuth = async (type) => {
            const email = document.getElementById('authEmail').value, pass = document.getElementById('authPass').value;
            if(!email || !pass) return alert("Punan ang lahat!");
            try {
                if(type === 'signup') await createUserWithEmailAndPassword(auth, email, pass);
                else await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) { alert(e.message); }
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            if(user) {
                currentUser = user;
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appSection').style.display = 'block';
                syncData();
            } else {
                document.getElementById('authSection').style.display = 'block';
                document.getElementById('appSection').style.display = 'none';
            }
        });

        function syncData() {
            onSnapshot(query(collection(db, "clients"), where("uid", "==", currentUser.uid)), snap => {
                clients = snap.docs.map(d => ({id: d.id, ...d.data()}));
                render();
            });
            onSnapshot(query(collection(db, "ledger"), where("uid", "==", currentUser.uid)), snap => {
                ledger = snap.docs.map(d => ({id: d.id, ...d.data()}));
                render();
            });
        }

        window.addClient = async () => {
            const fn = document.getElementById('fn').value, ln = document.getElementById('ln').value, area = document.getElementById('areaSelect').value;
            const ps = currentType === 'residential' ? document.getElementById('resPlans') : document.getElementById('bizPlans');
            if(!fn || !ln || !area || !ps.value) return alert("Punan lahat!");
            await addDoc(collection(db, "clients"), {
                uid: currentUser.uid, name: `${fn} ${ln}`, area, type: currentType,
                plan: ps.options[ps.selectedIndex].text, commi: parseInt(ps.options[ps.selectedIndex].dataset.commi),
                installed: false, cancelled: false, commiReceived: false, billingExplained: false, installDate: "", remarks: ""
            });
            document.getElementById('fn').value = ''; document.getElementById('ln').value = '';
        };

        window.toggleStatus = async (id, field) => {
            const c = clients.find(x => x.id === id);
            const update = { [field]: !c[field] };
            if(field === 'installed' && !c.installed) {
                update.cancelled = false;
                if (!c.installDate) {
                    update.installDate = new Date().toISOString().split('T')[0];
                }
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#000000', '#555555', '#aaaaaa'] }); // B&W Confetti!
            }
            if(field === 'cancelled' && !c.cancelled) update.installed = false;
            await updateDoc(doc(db, "clients", id), update);
        };

        window.updateField = async (id, field, val) => await updateDoc(doc(db, "clients", id), {[field]: val});
        window.deleteItem = async (id, type) => { if(confirm("Burahin?")) await deleteDoc(doc(db, type === 'client' ? "clients" : "ledger", id)); };

        window.addLedgerEntry = async () => {
            const desc = document.getElementById('ledgerDesc').value, amt = document.getElementById('ledgerAmount').value, dt = document.getElementById('ledgerDate').value;
            if(!desc || !amt || !dt) return alert("Punan ang lahat!");
            await addDoc(collection(db, "ledger"), { uid: currentUser.uid, desc, amount: parseFloat(amt), date: dt });
            document.getElementById('ledgerDesc').value = ''; document.getElementById('ledgerAmount').value = '';
        };

        window.render = () => {
            const list = document.getElementById('clientList'), lList = document.getElementById('ledgerList');
            const st = document.getElementById('searchInput').value.toLowerCase();
            const sm = parseInt(document.getElementById('viewMonth').value);
            list.innerHTML = ""; lList.innerHTML = "";

            let rT = 0, bT = 0, rC = 0, bC = 0;
            const sorted = [...clients].sort((a,b) => a.commiReceived - b.commiReceived || a.cancelled - b.cancelled);

            sorted.forEach(c => {
                if(st && !c.name.toLowerCase().includes(st) && !c.area.toLowerCase().includes(st)) return;
                if(currentStatusFilter === 'pending' && (c.installed || c.cancelled)) return;
                if(currentStatusFilter === 'installed' && !c.installed) return;
                if(currentStatusFilter === 'cancelled' && !c.cancelled) return;

                let show = false;
                if(!c.installed && !c.cancelled) show = true;
                else if(c.installed && c.installDate) {
                    const iDate = new Date(c.installDate);
                    if(iDate.getMonth() === sm) {
                        show = true;
                        if(c.type === 'business') { bT += c.commi; bC++; } else { rT += c.commi; rC++; }
                    }
                } else if(c.cancelled) show = true;

                if(show) {
                    const card = document.createElement('div');
                    card.className = `client-card ${c.installed?'client-installed':''} ${c.cancelled?'client-cancelled':''}`;
                    
                    // IN-UPDATE KO YUNG INLINE STYLES DITO PARA BUMAGAY SA B&W THEME
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items: flex-start;">
                            <div>
                                <span class="tag ${c.type==='business'?'tag-biz':'tag-res'}">${c.type}</span><br>
                                <strong style="font-size: 1.05rem; font-weight: 800;">${c.name}</strong><br>
                                <small style="color:var(--text-muted); font-size: 0.75rem; font-weight: 600;"><i class="fa-solid fa-location-dot"></i> ${c.area}</small>
                            </div>
                            <div style="text-align:right">
                                <i class="fa-solid fa-trash" onclick="deleteItem('${c.id}', 'client')" style="cursor:pointer; color:black;"></i><br>
                                <span style="font-weight: 800; font-size: 1.1rem; color: black;">₱${c.commi}</span>
                            </div>
                        </div>
                        
                        ${c.installed ? `
                        <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 0.8rem;">
                            <label style="color: black; font-weight: 700;"><i class="fa-regular fa-calendar-check"></i> Date:</label>
                            <input type="date" value="${c.installDate || ''}" onchange="updateField('${c.id}', 'installDate', this.value)" style="margin: 0; padding: 6px; width: auto; flex: 1; border-radius: 4px; font-size: 0.8rem; border: 2px solid black; font-weight: 600;">
                        </div>
                        
                        <div style="margin-top: 10px; display: flex; justify-content: space-around; font-size: 0.8rem; background: white; padding: 10px; border-radius: 4px; border: 2px solid black; box-shadow: 2px 2px 0px black;">
                            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; color: black; font-weight: 700;">
                                <input type="checkbox" ${c.billingExplained ? 'checked' : ''} onchange="updateField('${c.id}', 'billingExplained', this.checked)" style="width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: black;">
                                Billing Explained
                            </label>
                            <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; color: black; font-weight: 700; text-decoration: ${c.commiReceived ? 'line-through' : 'none'};">
                                <input type="checkbox" ${c.commiReceived ? 'checked' : ''} onchange="updateField('${c.id}', 'commiReceived', this.checked)" style="width: 16px; height: 16px; margin: 0; cursor: pointer; accent-color: black;">
                                Commi Received
                            </label>
                        </div>
                        ` : ''}

                        ${c.cancelled ? `
                        <div style="margin-top: 10px;">
                            <input type="text" placeholder="Remarks (e.g., No ports, nag-back out)" value="${c.remarks || ''}" onchange="updateField('${c.id}', 'remarks', this.value)" style="margin: 0; padding: 8px; width: 100%; border-radius: 4px; font-size: 0.8rem; border: 2px dashed black; background: #f4f4f0; color: black; font-weight: 600;">
                        </div>` : ''}

                        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px">
                            <button class="primary-btn" style="padding:8px; font-size: 0.8rem; background:${c.installed?'black':'white'}; color:${c.installed?'white':'black'}; box-shadow:${c.installed?'2px 2px 0px #555':'2px 2px 0px black'};" onclick="toggleStatus('${c.id}', 'installed')">${c.installed ? '<i class="fa-solid fa-check"></i> Installed' : 'Install'}</button>
                            <button class="primary-btn" style="padding:8px; font-size: 0.8rem; background:${c.cancelled?'#eaeaea':'white'}; color:black; border-style:${c.cancelled?'dashed':'solid'};" onclick="toggleStatus('${c.id}', 'cancelled')">${c.cancelled ? 'Cancelled' : 'Cancel'}</button>
                        </div>
                    `;
                    list.appendChild(card);
                }
            });

            document.getElementById('resCommi').innerText = `₱${rT.toLocaleString()}`;
            document.getElementById('bizCommi').innerText = `₱${bT.toLocaleString()}`;
            document.getElementById('targetCount').innerText = `${rC+bC} / 20`;
            document.getElementById('targetBreakdown').innerText = `${rC} Res | ${bC} Biz`;
            document.getElementById('progressFill').style.width = `${Math.min(((rC+bC)/20)*100, 100)}%`;
            
            let exT = 0;
            ledger.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(l => {
                exT += l.amount;
                lList.innerHTML += `
                    <div style="display: flex; justify-content: space-between; border-bottom: 2px dashed black; padding: 10px 0; margin-bottom: 5px;">
                        <div><strong>${l.desc}</strong><br><small style="font-weight: 600;">${l.date}</small></div>
                        <div style="font-weight: 800;">₱${l.amount.toLocaleString()} <i class="fa-solid fa-trash" onclick="deleteItem('${l.id}', 'ledger')" style="color:black; cursor:pointer; margin-left:10px"></i></div>
                    </div>`;
            });
            document.getElementById('extraTotal').innerText = `₱${exT.toLocaleString()}`;
        };

        window.toggleLedger = () => document.getElementById('ledgerSidebar').classList.toggle('active');
        window.setStatusFilter = (s, el) => {
            currentStatusFilter = s;
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active'); render();
        };
        window.setClientType = (t) => {
            currentType = t;
            document.getElementById('resBtn').classList.toggle('active', t==='residential');
            document.getElementById('bizBtn').classList.toggle('active', t==='business');
            document.getElementById('resPlans').classList.toggle('hidden', t==='business');
            document.getElementById('bizPlans').classList.toggle('hidden', t==='residential');
        };

        const vm = document.getElementById('viewMonth');
        months.forEach((m,i) => vm.innerHTML += `<option value="${i}" ${i===new Date().getMonth()?'selected':''}>${m}</option>`);
    </script>
    
    <script>
        // SERVICE WORKER REGISTRATION
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.error('Service Worker Registration Failed!', err));
            });
        }

        // FORCE CLEAR CACHE AND RELOAD FUNCTION
        window.clearCache = () => {
            if (confirm("Gusto mo bang i-clear ang cache at i-reload ang app?")) {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(function(registrations) {
                        for(let registration of registrations) {
                            registration.unregister();
                        }
                    });
                }
                if ('caches' in window) {
                    caches.keys().then((names) => {
                        for (let name of names) {
                            caches.delete(name);
                        }
                    });
                }
                setTimeout(() => {
                    window.location.reload(true);
                }, 500);
            }
        };
    </script>
</body>
</html>
