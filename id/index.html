<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheetah Space | ID Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark: #090a0f; 
            --bg-deep: #12141d;
            --card-dark: rgba(20, 24, 36, 0.7);
            --primary-orange: #ff6a00; 
            --accent-orange: #ff9100; 
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --glass-border: rgba(255, 106, 0, 0.15);
        }

        * { font-family: 'Poppins', sans-serif; box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body {
            background: radial-gradient(circle at 10% 10%, rgba(255,106,0,0.08), transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(59,130,246,0.05), transparent 40%),
                        var(--bg-dark);
            background-attachment: fixed; color: var(--text-main); 
            margin: 0; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,106,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-orange); }

        .container { width: 100%; max-width: 450px; } 

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-weight: 800; font-size: 2rem; letter-spacing: 1px; }
        .header h1 span { color: var(--primary-orange); }
        .header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .glass-panel { 
            background: var(--card-dark); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            padding: 25px; border-radius: 20px; margin-bottom: 25px; 
            border: 1px solid var(--glass-border); box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

        input { 
            width: 100%; padding: 14px; background: rgba(0, 0, 0, 0.4); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            color: white; font-size: 0.95rem; margin-bottom: 15px; 
        }
        input:focus { outline: none; border-color: var(--primary-orange); box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.15); background: rgba(0, 0, 0, 0.6); }

        .file-upload-wrapper { position: relative; margin-bottom: 15px; }
        .file-upload-box {
            display: flex; align-items: center; justify-content: center; width: 100%; padding: 16px;
            background: rgba(0, 0, 0, 0.4); border: 1px dashed rgba(255,255,255,0.2);
            border-radius: 12px; color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
            cursor: pointer; transition: all 0.3s ease; box-sizing: border-box;
        }
        .file-upload-box:hover { border-color: var(--primary-orange); background: rgba(255, 106, 0, 0.05); color: white; }
        #photoUpload { display: none; }

        button.primary-btn { 
            background: linear-gradient(135deg, var(--primary-orange), var(--accent-orange)); 
            padding: 16px; border-radius: 12px; border: none; font-weight: 800; color: white; 
            cursor: pointer; width: 100%; box-shadow: 0 6px 20px rgba(255, 106, 0, 0.3);
            text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px;
        }
        button.primary-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 106, 0, 0.5); }

        /* --- THE DIGITAL ID CARD DESIGN --- */
        .id-card-container { display: flex; justify-content: center; margin-bottom: 20px; }
        
        .id-card {
            width: 320px; height: 500px;
            background: linear-gradient(180deg, #1a1e29 0%, #090a0f 100%);
            border-radius: 16px; position: relative; overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center;
        }

        /* Top Orange Bar */
        .id-top-bar {
            width: 100%; height: 8px;
            background: linear-gradient(90deg, var(--primary-orange), var(--accent-orange));
        }

        /* ID Header */
        .id-header { width: 100%; text-align: center; padding: 25px 20px 15px 20px; }
        .id-header h2 { margin: 0; font-size: 1.6rem; font-weight: 800; color: white; letter-spacing: 2px; }
        .id-header h2 span { color: var(--primary-orange); }

        /* Photo Area */
        .id-photo-container {
            width: 150px; height: 150px;
            border-radius: 50%; padding: 4px;
            background: linear-gradient(135deg, var(--primary-orange), var(--accent-orange));
            margin-bottom: 20px; box-shadow: 0 10px 20px rgba(255,106,0,0.2);
            position: relative; z-index: 2;
        }
        .id-photo {
            width: 100%; height: 100%; border-radius: 50%;
            background-color: #2a3040; object-fit: cover;
            border: 4px solid #1a1e29;
        }

        /* ID Body Info */
        .id-body { text-align: center; padding: 0 20px; width: 100%; z-index: 2; }
        .id-name { font-size: 1.4rem; font-weight: 800; color: white; margin: 0 0 5px 0; text-transform: uppercase; line-height: 1.1; word-wrap: break-word; }
        .id-title { font-size: 0.75rem; font-weight: 800; color: var(--primary-orange); text-transform: uppercase; letter-spacing: 1.5px; margin: 0 0 15px 0; }
        
        .id-divider { width: 40px; height: 3px; background: rgba(255,255,255,0.1); margin: 0 auto 15px auto; border-radius: 2px; }

        .id-details { font-size: 0.8rem; color: #94a3b8; margin: 0; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .id-details span { color: white; }

        /* ID Footer Background Elements */
        .id-bg-element {
            position: absolute; bottom: -50px; left: -50%; width: 200%; height: 150px;
            background: radial-gradient(ellipse at center, rgba(255,106,0,0.1) 0%, transparent 70%);
            z-index: 1; pointer-events: none;
        }
        
        .id-footer {
            position: absolute; bottom: 0; width: 100%; padding: 15px;
            text-align: center; background: rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.05); z-index: 2;
        }
        .id-footer p { margin: 0; font-size: 0.65rem; color: #64748b; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>DIGITAL<span style="color:var(--primary-orange)">//</span>ID</h1>
            <p>Agent Identification Card</p>
        </div>

        <div class="glass-panel">
            <label>1. Upload ID Picture (1x1 or Square)</label>
            <div class="file-upload-wrapper">
                <input type="file" id="photoUpload" accept="image/*">
                <label for="photoUpload" class="file-upload-box" id="upload-label">
                    <i class="fa-solid fa-camera" style="margin-right: 8px;"></i> Choose Photo
                </label>
            </div>

            <label>2. Full Name</label>
            <input type="text" id="inputName" placeholder="e.g. Juan Dela Cruz" onkeyup="updateID()">

            <label>3. Area Designation</label>
            <input type="text" id="inputArea" placeholder="e.g. Taytay / Angono" onkeyup="updateID()">

            <label>4. Agent ID Number (Optional)</label>
            <input type="text" id="inputNumber" placeholder="e.g. CHT-2026-001" onkeyup="updateID()">
        </div>

        <div class="id-card-container">
            <div class="id-card" id="idPreviewCanvas">
                <div class="id-top-bar"></div>
                <div class="id-bg-element"></div>
                
                <div class="id-header">
                    <h2>CHEETAH<span>//</span></h2>
                </div>

                <div class="id-photo-container">
                    <img src="https://via.placeholder.com/150/2a3040/475569?text=PHOTO" alt="Agent Photo" class="id-photo" id="previewImage">
                </div>

                <div class="id-body">
                    <h3 class="id-name" id="display-name">JUAN DELA CRUZ</h3>
                    <p class="id-title">Accredited Account Executive</p>
                    
                    <div class="id-divider"></div>
                    
                    <p class="id-details" style="margin-bottom: 5px;">Area: <span id="display-area">TAYTAY</span></p>
                    <p class="id-details">ID NO: <span id="display-number">CHT-000-000</span></p>
                </div>

                <div class="id-footer">
                    <p>Official Sales Partner • Cheetah Broadband</p>
                </div>
            </div>
        </div>

        <button class="primary-btn" onclick="exportID()" id="exportBtn">
            <i class="fa-solid fa-download"></i> Download as JPG
        </button>
    </div>

<script>
        // --- AUTO-SAVE LOGIC (LOCAL STORAGE) ---
        function saveProfile() {
            const profile = {
                name: document.getElementById('inputName').value,
                area: document.getElementById('inputArea').value,
                number: document.getElementById('inputNumber').value,
                photo: document.getElementById('previewImage').src
            };
            
            // Try-catch block dahil minsan masyadong malaki ang image file para i-save sa local storage
            try {
                localStorage.setItem('cheetah_id_profile', JSON.stringify(profile));
            } catch (e) {
                console.warn("Image might be too large to auto-save. Try a smaller file.");
            }
        }

        function loadProfile() {
            const savedData = localStorage.getItem('cheetah_id_profile');
            if (savedData) {
                const profile = JSON.parse(savedData);
                
                // I-load ang text fields
                if (profile.name) document.getElementById('inputName').value = profile.name;
                if (profile.area) document.getElementById('inputArea').value = profile.area;
                if (profile.number) document.getElementById('inputNumber').value = profile.number;
                
                // I-load ang picture kung meron at valid base64 image
                if (profile.photo && profile.photo.startsWith('data:image')) {
                    document.getElementById('previewImage').src = profile.photo;
                    document.getElementById('upload-label').innerHTML = `<i class="fa-solid fa-check" style="color:var(--green-installed); margin-right: 8px;"></i> Saved Photo Loaded`;
                    document.getElementById('upload-label').style.borderColor = "var(--primary-orange)";
                }
                
                updateID(); // I-refresh ang live preview
            }
        }

        // --- HANDLE UPLOADS & TYPING ---
        document.getElementById('photoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                document.getElementById('upload-label').innerHTML = `<i class="fa-solid fa-check" style="color:var(--green-installed); margin-right: 8px;"></i> Photo Uploaded`;
                document.getElementById('upload-label').style.borderColor = "var(--primary-orange)";
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    document.getElementById('previewImage').src = event.target.result;
                    saveProfile(); // I-save agad pagka-upload
                };
                reader.readAsDataURL(file);
            }
        });

        function updateID() {
            const name = document.getElementById('inputName').value.trim();
            const area = document.getElementById('inputArea').value.trim();
            const number = document.getElementById('inputNumber').value.trim();

            document.getElementById('display-name').innerText = name ? name : "JUAN DELA CRUZ";
            document.getElementById('display-area').innerText = area ? area : "TAYTAY";
            document.getElementById('display-number').innerText = number ? number : "CHT-000-000";
            
            saveProfile(); // I-save tuwing may tina-type
        }

        // --- EXPORT TO JPG ---
        function exportID() {
            const btn = document.getElementById('exportBtn');
            const idCard = document.getElementById('idPreviewCanvas');
            const nameToSave = document.getElementById('inputName').value.trim() || 'Agent';

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> GENERATING...`;
            btn.disabled = true;

            setTimeout(() => {
                html2canvas(idCard, { 
                    scale: 3, 
                    backgroundColor: '#090a0f',
                    useCORS: true,
                    logging: false
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = `Cheetah_ID_${nameToSave}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.95);
                    link.click();

                    btn.innerHTML = `<i class="fa-solid fa-check"></i> SAVED TO GALLERY!`;
                    btn.style.background = "var(--green-installed)";
                    
                    setTimeout(() => {
                        btn.innerHTML = `<i class="fa-solid fa-download"></i> Download as JPG`;
                        btn.style.background = "";
                        btn.disabled = false;
                    }, 2500);
                }).catch(err => {
                    alert("May error sa pag-generate ng image. Please try again.");
                    btn.innerHTML = `<i class="fa-solid fa-download"></i> Download as JPG`;
                    btn.disabled = false;
                });
            }, 300);
        }

        // I-load ang profile kapag nabuksan ang page
        window.addEventListener('DOMContentLoaded', loadProfile);
    </script>
</body>
</html>
