<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheetah Space | Locator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            /* DEEP SPACE DARK MODE COLORS */
            --bg-dark: #090a0f; 
            --bg-deep: #12141d;
            --card-dark: rgba(20, 24, 36, 0.7);
            
            /* CHEETAH ORANGE NEON */
            --primary-orange: #ff6a00; 
            --accent-orange: #ff9100; 
            
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --glass-border: rgba(255, 106, 0, 0.15);
            --green-installed: #10b981; 
            --red-alert: #f43f5e; 
            --blue-biz: #3b82f6;
        }

        * { font-family: 'Poppins', sans-serif; box-sizing: border-box; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        body {
            background: radial-gradient(circle at 10% 10%, rgba(255,106,0,0.08), transparent 40%),
                        radial-gradient(circle at 90% 90%, rgba(59,130,246,0.05), transparent 40%),
                        var(--bg-dark);
            background-attachment: fixed;
            color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* Sleek Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,106,0,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-orange); }

        .container { width: 100%; max-width: 500px; padding-bottom: 80px; margin-top: 20px; } 
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-weight: 800; font-size: 2rem; letter-spacing: 1px; }
        .header h1 span { color: var(--primary-orange); }
        .header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .search-wrapper { position: relative; margin-bottom: 15px; }
        .search-wrapper i { position: absolute; left: 18px; top: 18px; color: var(--text-muted); font-size: 1.1rem; }
        
        #areaSearch { 
            width: 100%; padding: 16px 16px 16px 50px; 
            background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 16px; color: white; font-size: 0.95rem; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        #areaSearch:focus {
            outline: none; border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 106, 0, 0.15);
            background: rgba(0, 0, 0, 0.6);
        }

        .status-msg { font-size: 0.8rem; text-align: center; margin-bottom: 20px; color: var(--text-muted); font-weight: 600; }
        
        /* Area Cards with Glassmorphism */
        .area-card { 
            background: var(--card-dark); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 20px; border-radius: 16px; margin-bottom: 15px; 
            border: 1px solid rgba(255,255,255,0.05); border-left: 4px solid rgba(255,255,255,0.1);
        }
        .area-card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.1); }
        
        .area-card.available { border-left-color: var(--green-installed); }
        .area-card.non-commissionable { border-left-color: var(--red-alert); opacity: 0.8; }
        
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .card-top strong { font-size: 1.05rem; font-weight: 700; color: white; line-height: 1.3; }
        
        .status-badge { font-size: 0.65rem; font-weight: 800; padding: 5px 10px; border-radius: 8px; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; margin-left: 10px; }
        .status-available { background: rgba(16, 185, 129, 0.15); color: var(--green-installed); border: 1px solid rgba(16,185,129,0.3); }
        .status-non-commissionable { background: rgba(244, 63, 94, 0.15); color: var(--red-alert); border: 1px solid rgba(244,63,94,0.3); }
        
        .card-details { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }
        .card-details i { color: var(--primary-orange); margin-right: 5px; }

        /* Floating Action Button */
        .fab { 
            position: fixed; bottom: 30px; right: 30px; 
            background: linear-gradient(135deg, var(--primary-orange), var(--accent-orange)); 
            width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            color: white; font-size: 1.5rem; box-shadow: 0 8px 25px rgba(255, 106, 0, 0.5); 
            cursor: pointer; z-index: 1001; 
        }
        .fab:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 30px rgba(255,106,0,0.6); }

        /* Suggestion Bottom Sheet */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 10, 15, 0.8); backdrop-filter: blur(5px); display: none; z-index: 1999; }
        
        .suggestion-box { 
            position: fixed; bottom: -100%; left: 0; right: 0; width: 100%; max-width: 500px; margin: 0 auto; 
            background: var(--card-dark); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 25px 25px 0 0; padding: 30px 25px 40px 25px; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5); display: block; z-index: 2000; 
            border: 1px solid var(--glass-border); border-bottom: none; box-sizing: border-box;
            transition: bottom 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .suggestion-box.active { bottom: 0; }
        
        .suggestion-box h3 { margin: 0 0 20px 0; color: white; font-weight: 800; display: flex; align-items: center; gap: 10px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }
        .suggestion-box h3 i { color: var(--primary-orange); }
        
        .suggest-input { 
            width: 100%; background: rgba(0, 0, 0, 0.4); color: white; 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
            padding: 14px 15px; box-sizing: border-box; margin-bottom: 12px; font-size: 0.9rem; 
        }
        .suggest-input:focus { outline: none; border-color: var(--primary-orange); background: rgba(0, 0, 0, 0.6); }
        
        #submitBtn { 
            width: 100%; background: linear-gradient(135deg, var(--primary-orange), var(--accent-orange)); 
            color: white; border: none; padding: 16px; border-radius: 12px; font-weight: 800; 
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
            text-transform: uppercase; letter-spacing: 1.5px; font-size: 0.9rem; margin-top: 10px;
        }
        #submitBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 106, 0, 0.5); }
    </style>
</head>
<body>

    <div class="container" id="mainApp">
        <div class="header">
            <h1>CHEETAH<span style="color:var(--primary-orange)">//</span>LOCATOR</h1>
            <p>Live Coverage Checker</p>
        </div>
        
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="areaSearch" placeholder="Search Street, Brgy, or Town..." onkeyup="doSearch()">
        </div>
        
        <div id="statusMsg" class="status-msg"><i class="fa-solid fa-satellite-dish fa-spin" style="margin-right: 5px;"></i> Initializing database...</div>
        <div id="resultsList"></div>
    </div>

    <div class="fab" id="fabBtn" onclick="toggleSuggest()">
        <i class="fa-solid fa-map-location-dot"></i>
    </div>

    <div class="overlay" id="overlay" onclick="toggleSuggest()"></div>
    <div class="suggestion-box" id="suggestBox">
        <h3><i class="fa-solid fa-location-crosshairs"></i> Suggest Area</h3>
        <input type="text" id="suggestStreet" placeholder="📍 Street / Sitio / Phase" class="suggest-input">
        <input type="text" id="suggestBrgy" placeholder="🏘️ Barangay" class="suggest-input">
        <input type="text" id="suggestBayan" placeholder="🏙️ Town / City" class="suggest-input">
        <button id="submitBtn" onclick="sendToTelegram(event)">
            <span>Transmit Data</span>
            <i class="fa-solid fa-satellite-dish"></i>
        </button>
    </div>

    <script>
        // --- CSV & SEARCH LOGIC ---
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTSZsOoXLFwGqdPDq7WzBFSbyGxLrHiQTwylDU2lW5BN9cCt3oPhgBi79bOHBen8u2HD2oBhV9GGHoJ/pub?output=csv"; 
        let areaData = [];

        function init() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    areaData = results.data.filter(row => row.Bayan && row.Bayan.trim() !== "");
                    if(areaData.length > 0) {
                        document.getElementById('statusMsg').innerHTML = `<span style="color:var(--green-installed);"><i class="fa-solid fa-circle-check"></i> Database Online: ${areaData.length} records</span>`;
                    }
                }
            });
        }

        function doSearch() {
            const query = document.getElementById('areaSearch').value.toLowerCase().trim();
            const list = document.getElementById('resultsList');
            list.innerHTML = "";
            if (query.length < 2) return;
            
            const matches = areaData.filter(row => {
                const b = (row.Bayan || "").toString().toLowerCase();
                const br = (row.Barangay || "").toString().toLowerCase();
                const s = (row.Street || "").toString().toLowerCase();
                return b.includes(query) || br.includes(query) || s.includes(query);
            }).slice(0, 30);

            matches.forEach(row => {
                const stat = (row.Status || "Unknown").trim();
                const isAvail = stat.toLowerCase().includes('avail');
                
                list.innerHTML += `
                    <div class="area-card ${isAvail ? 'available' : 'non-commissionable'}">
                        <div class="card-top">
                            <strong>${row.Street || 'Main Area'}</strong>
                            <span class="status-badge ${isAvail ? 'status-available' : 'status-non-commissionable'}">${stat}</span>
                        </div>
                        <div class="card-details">
                            <i class="fa-solid fa-location-dot"></i> ${row.Bayan} • Brgy. ${row.Barangay}
                        </div>
                    </div>`;
            });
        }

        // --- BOTTOM SHEET LOGIC ---
        function toggleSuggest() {
            const box = document.getElementById('suggestBox');
            const overlay = document.getElementById('overlay');
            const isActive = box.classList.contains('active');
            
            if (isActive) {
                box.classList.remove('active');
                setTimeout(() => overlay.style.display = 'none', 300); // Wait for slide down
            } else {
                overlay.style.display = 'block';
                setTimeout(() => box.classList.add('active'), 10); // Trigger slide up
            }
        }

        // --- TELEGRAM LOGIC ---
        async function sendToTelegram(e) {
            if (e) e.preventDefault();
            const street = document.getElementById('suggestStreet').value.trim();
            const brgy = document.getElementById('suggestBrgy').value.trim();
            const bayan = document.getElementById('suggestBayan').value.trim();
            const btn = document.getElementById('submitBtn');
            if (!street || !brgy || !bayan) return alert("⚠️ Kumpletuhin ang details bago mag-submit.");

            const botToken = "8432694449:AAEbMBiUTNzIaabNXWkhhZhFgtr0_PSC-eM"; 
            const chatId = "6551261245"; 
            const message = `<b>📢 NEW AREA SUGGESTION</b>\n\n📍 <b>Street:</b> ${street}\n🏘️ <b>Barangay:</b> ${brgy}\n🏙️ <b>Bayan:</b> ${bayan}`;

            try {
                btn.innerHTML = "Transmitting... <i class='fa-solid fa-satellite-dish fa-spin'></i>";
                btn.style.opacity = "0.7";
                btn.disabled = true;
                
                const response = await fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: "HTML" })
                });
                
                if (response.ok) {
                    alert("✅ Suggestion Transmitted!");
                    document.getElementById('suggestStreet').value = "";
                    document.getElementById('suggestBrgy').value = "";
                    document.getElementById('suggestBayan').value = "";
                    toggleSuggest();
                }
            } catch (error) { 
                alert("❌ Connection Error."); 
            } finally { 
                btn.innerHTML = `<span>Transmit Data</span> <i class="fa-solid fa-satellite-dish"></i>`; 
                btn.style.opacity = "1";
                btn.disabled = false; 
            }
        }

        // Initialize App
        window.onload = init;
    </script>
</body>
</html>
