<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheetah Pro | Workspace</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docxtemplater/3.45.0/docxtemplater.js"></script>
    <script src="https://unpkg.com/pizzip@3.1.6/dist/pizzip.js"></script>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #090a0f; --bg-deep: #12141d; --card-dark: rgba(20, 24, 36, 0.7);
            --primary-orange: #ff6a00; --accent-orange: #ff9100;
            --text-main: #f8fafc; --text-muted: #64748b; --glass-border: rgba(255, 106, 0, 0.15);
            --green-installed: #10b981; --red-alert: #f43f5e; --blue-biz: #3b82f6;
        }
        * { font-family: 'Poppins', sans-serif; box-sizing: border-box; transition: all 0.3s; }
        body { background: var(--bg-dark); color: var(--text-main); margin: 0; padding: 20px; min-height: 100vh; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        .card { background: var(--card-dark); backdrop-filter: blur(10px); padding: 30px; border-radius: 20px; border: 1px solid var(--glass-border); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; font-weight: 800; color: var(--primary-orange); text-transform: uppercase; text-align: center; letter-spacing: 1px;}
        label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; margin-top: 15px; }
        .main-input, select, textarea { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; color: white; width: 100%; font-size: 0.9rem; }
        textarea { height: 130px; font-family: monospace; }
        .btn { border: none; padding: 15px; border-radius: 10px; color: white; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; margin-top: 10px;}
        .btn-orange { background: linear-gradient(135deg, var(--primary-orange), var(--accent-orange)); }
        .btn-orange:hover { box-shadow: 0 5px 15px rgba(255,106,0,0.4); transform: translateY(-2px); }
        .btn-gray { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
        .btn-gray:hover { background: rgba(255,255,255,0.2); }
        .status { text-align: center; font-size: 0.85rem; margin-top: 15px; font-weight: 600; min-height: 20px;}
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        
        #pdfSection { display: none; margin-top: 25px; padding-top: 20px; border-top: 1px dashed rgba(255,255,255,0.1); animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>⚡ CHEETAH PRO APP</h2>
        
        <label>Agent Name</label>
        <input type="text" id="agentInput" class="main-input" placeholder="Juan Dela Cruz">

        <label>1. Select Area Template</label>
        <select id="areaSelect" class="main-input" style="cursor: pointer;">
            <option value="bctv.docx">BCTV</option>
            <option value="skyline.docx">Skyline</option>
            <option value="kabayan.docx">Kabayan</option>
        </select>

        <label>2. Client Data</label>
        <textarea id="rawInput" placeholder="LAST NAME:&#10;FIRST NAME:&#10;MUNICIPALITY:&#10;..."></textarea>

        <div class="grid" style="margin-top: 20px;">
            <button class="btn btn-gray" onclick="processDocxOnly()">
                📄 Download DOCX
            </button>
            <button class="btn btn-orange" onclick="togglePdfMode()">
                🎨 Proceed to PDF
            </button>
        </div>
        <div id="mainStatus" class="status"></div>

        <div id="pdfSection">
            <h3 style="font-size: 1rem; color: var(--primary-orange); margin-top: 0; text-align: center;">PDF STAMPER MODE</h3>
            <div class="grid">
                <div>
                    <label>Upload Sketch</label>
                    <input type="file" id="sketchFile" accept="image/*" class="main-input">
                </div>
                <div>
                    <label>Upload Signature</label>
                    <input type="file" id="sigFile" accept="image/*" class="main-input">
                </div>
            </div>

            <label>Admin Passcode (Required)</label>
            <input type="password" id="passcode" class="main-input" placeholder="Enter 4-digit code">

            <button class="btn btn-orange" id="generatePdfBtn" onclick="processPdfFull()">
                ✨ VERIFY & GENERATE PDF
            </button>
            <div id="pdfStatus" class="status"></div>
        </div>

    </div>
</div>

<script>
    // ==========================================
    // LOCAL STORAGE (Auto-Save)
    // ==========================================
    const agent = document.getElementById('agentInput');
    const area = document.getElementById('areaSelect');
    const raw = document.getElementById('rawInput');

    document.addEventListener('DOMContentLoaded', () => {
        if(localStorage.getItem('cp_agent')) agent.value = localStorage.getItem('cp_agent');
        if(localStorage.getItem('cp_area')) area.value = localStorage.getItem('cp_area');
        if(localStorage.getItem('cp_raw')) raw.value = localStorage.getItem('cp_raw');
    });

    agent.addEventListener('input', () => localStorage.setItem('cp_agent', agent.value));
    area.addEventListener('change', () => localStorage.setItem('cp_area', area.value));
    raw.addEventListener('input', () => localStorage.setItem('cp_raw', raw.value));

    // ==========================================
    // HELPER: PARSE DATA
    // ==========================================
    function parseData(text) {
        const lines = text.split('\n'); const data = {}; let key = "";
        lines.forEach(line => {
            line = line.trim(); if(!line) return;
            const idx = line.indexOf(':');
            if(idx !== -1) {
                key = line.substring(0, idx).trim().toUpperCase();
                data[key] = line.substring(idx + 1).trim();
            } else if(key) {
                data[key] += " " + line;
            }
        });
        return data;
    }

    // ==========================================
    // LOGIC 1: DOCX ONLY
    // ==========================================
    async function processDocxOnly() {
        const status = document.getElementById('mainStatus');
        if (!raw.value) { status.innerText = "⚠️ Please paste client data first."; status.style.color = "var(--red-alert)"; return; }
        
        status.innerText = "Processing DOCX..."; status.style.color = "white";

        try {
            const res = await fetch(`./${area.value}`);
            if (!res.ok) throw new Error("Template not found on server.");
            
            const arrayBuffer = await res.arrayBuffer();
            const zip = new PizZip(arrayBuffer);
            const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
            
            const client = parseData(raw.value);
            const agentName = agent.value || "AGENT";

            // TAG MAPPING
            doc.render({
                agent_name: agentName.toUpperCase(),
                last_name: (client["LAST NAME"] || "").toUpperCase(),
                first_name: (client["FIRST NAME"] || "").toUpperCase(),
                muni: (client["MUNICIPALITY"] || "").toUpperCase()
                // ADD OTHER TAGS HERE IF NEEDED
            });

            const out = doc.getZip().generate({ type: "blob" });
            const providerName = area.value.split('.')[0].toUpperCase();
            
            saveAs(out, `${providerName}_${client["LAST NAME"] || "FORM"}.docx`);
            status.innerText = "✨ DOCX Downloaded successfully!"; status.style.color = "var(--green-installed)";
            
            document.getElementById('pdfSection').style.display = "none";
        } catch (e) {
            console.error(e);
            status.innerText = "❌ Error: " + e.message; status.style.color = "var(--red-alert)";
        }
    }

    // ==========================================
    // UI: TOGGLE PDF MODE
    // ==========================================
    function togglePdfMode() {
        const pdfSec = document.getElementById('pdfSection');
        const status = document.getElementById('mainStatus');
        if (!raw.value) { status.innerText = "⚠️ Please paste client data first."; status.style.color = "var(--red-alert)"; return; }
        status.innerText = "";
        pdfSec.style.display = pdfSec.style.display === "block" ? "none" : "block";
    }

    // ==========================================
    // LOGIC 2: PDF FULL PROCESS (Calls Phase 2 Backend)
    // ==========================================
    async function processPdfFull() {
        const status = document.getElementById('pdfStatus');
        const pass = document.getElementById('passcode').value;
        const btn = document.getElementById('generatePdfBtn');

        if (pass !== "2026") { status.innerText = "❌ Invalid Passcode!"; status.style.color = "var(--red-alert)"; return; }
        
        btn.disabled = true;
        status.innerText = "⏳ Step 1: Generating Document..."; status.style.color = "white";

        try {
            // 1. GENERATE DOCX IN MEMORY
            const res = await fetch(`./${area.value}`);
            const arrayBuffer = await res.arrayBuffer();
            const zip = new PizZip(arrayBuffer);
            const doc = new window.docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
            const client = parseData(raw.value);
            
            doc.render({
                agent_name: (agent.value || "AGENT").toUpperCase(),
date: getFormattedDate().toUpperCase(), last_name: get("LAST NAME"), first_name: get("FIRST NAME"), middle_name: get("MIDDLE NAME"),
                hp: get("HOUSE PHONE"), op: get("OFFICE PHONE"), mobile: get("MOBILE PHONE"), email: get("EMAIL ADDRESS", true), id_no: get("ID TYPE/NO."), 
                birthdate: get("BIRTHDATE"), age: get("AGE"), sex: get("SEX"), civil_status: get("CIVIL STATUS"), spouse_name: get("SPOUSE NAME"),
                house_no: get("HOUSE/BLOCK/UNIT NO."), street: get("STREET"), building: get("BUILDING"), subd: get("DISTRICT/SUBDIVISION"), barangay: get("BARANGAY"), municipality: get("MUNICIPALITY"),
                occupation: get("OCCUPATION/POSITION"), employer: get("EMPLOYER"), occ_address: get("ADDRESS"), spouse_occ: get("SPOUSE OCCUPATION"), spouse_emp: get("SPOUSE EMPLOYER"), spouse_add_occ: get("SPOUSE EMPLOYER ADDRESS"),
                plan_name: get("PLAN"), plan_value: get("PLAN VALUE")
            });

            // Convert raw docx binary to base64 so we can send it securely to our Vercel API
            const docxBinary = doc.getZip().generate({ type: "string" });
            const docxBase64 = window.btoa(docxBinary);

            // 2. SEND TO OUR VERCEL BACKEND API (Phase 2)
            status.innerText = "☁️ Step 2: Requesting Conversion from Server..."; status.style.color = "var(--blue-biz)";
            
            const apiResponse = await fetch('/api/convert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fileBase64: docxBase64 })
            });

            if (!apiResponse.ok) throw new Error("Server API Failed. Check Vercel logs.");
            
            const apiResult = await apiResponse.json();
            const pdfBase64 = apiResult.pdfBase64;
            
            // Decode Base64 PDF back to binary for pdf-lib
            const binaryString = window.atob(pdfBase64);
            const pdfBytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) pdfBytes[i] = binaryString.charCodeAt(i);

            // 3. STAMP IMAGES
            status.innerText = "🎨 Step 3: Stamping Images..."; status.style.color = "var(--accent-orange)";
            
            const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
            const page = pdfDoc.getPages()[0];
            const { height } = page.getSize();

            const sketchFile = document.getElementById('sketchFile').files[0];
            if(sketchFile) {
                const imgBytes = await sketchFile.arrayBuffer();
                const img = sketchFile.type.includes('png') ? await pdfDoc.embedPng(imgBytes) : await pdfDoc.embedJpg(imgBytes);
                page.drawImage(img, { x: 320, y: height - 480, width: 250, height: 180 }); // Adjust X/Y
            }

            const sigFile = document.getElementById('sigFile').files[0];
            if(sigFile) {
                const sigBytes = await sigFile.arrayBuffer();
                const sig = sigFile.type.includes('png') ? await pdfDoc.embedPng(sigBytes) : await pdfDoc.embedJpg(sigBytes);
                page.drawImage(sig, { x: 180, y: 50, width: 120, height: 50 }); // Adjust X/Y
            }

            // 4. DOWNLOAD
            const finalPdf = await pdfDoc.save();
            const providerName = area.value.split('.')[0].toUpperCase();
            saveAs(new Blob([finalPdf]), `${providerName}_${client["LAST NAME"] || "SIGNED"}.pdf`);
            
            status.innerText = "✨ PDF Secured & Downloaded!"; status.style.color = "var(--green-installed)";
            document.getElementById('passcode').value = ""; 

        } catch (error) {
            console.error(error);
            status.innerText = "❌ Error: " + error.message; status.style.color = "var(--red-alert)";
        } finally {
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
